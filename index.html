<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch & Win - Free Entry Lottery</title>
  <style>
    :root {
      --bg-color: #0b0b10;
      --card-bg: #161522;
      --accent-purple: #8a2be2;
      --accent-glow: #b16bff;
      --text-main: #f0f0f5;
      --text-muted: #a0a0b0;
      --border-color: #2a293d;
      --gold-accent: #ffd700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Navigation */
    header {
      background-color: var(--card-bg);
      border-bottom: 2px solid var(--accent-purple);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--text-main);
      text-decoration: none;
    }

    .logo span {
      color: var(--accent-glow);
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 1.5rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover {
      color: var(--accent-glow);
    }

    /* Three-Column Layout: Ad Left | Content Center | Ad Right */
    .container {
      display: grid;
      grid-template-columns: 220px 1fr 220px;
      gap: 1.5rem;
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1rem;
      flex: 1;
      width: 100%;
    }

    /* Side Ad Columns */
    .ad-column {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

      border-radius: 8px;
